# Runtime configuration for kalshi-botv3.
# Secrets (API keys, paths) live in .env — never here.

# Kalshi crypto markets the bot trades (15-minute up/down contracts)
markets:
  - BTC
  - ETH
  - XRP
  - SOL
  - DOGE
  - HYPE
  - BNB

trade:
  # Dollar amount staked per contract (Kalshi minimum is $0.01, keep small for safety)
  size_usd: 5

  # Minimum edge in cents (100-basis EV) required before placing a trade
  edge_threshold_cents: 4

  # Maximum Kalshi bid-ask spread in cents; wider spreads → skip the market
  max_kalshi_spread_cents: 8

  # Seconds after a 15-min window opens before the bot makes a decision;
  # gives price action time to stabilise away from the open
  entry_delay_seconds: 75

scheduler:
  # Length of each Kalshi trading window in minutes (always 15 for these markets)
  window_minutes: 15

  # How many minutes of price history to load on startup before trading begins
  warmup_minutes: 60

features:
  # Total OHLCV history (in minutes) fetched for feature computation
  ohlcv_lookback_minutes: 240

  # Rolling window for realised-volatility calculation
  realized_vol_window_minutes: 60

  # Number of 1-minute bars used to compute ATR
  atr_window_bars: 14

exchanges:
  # Primary price source for all assets (lowest latency preferred)
  primary: coinbase

  # Fallback price source if primary is unavailable
  secondary: binance

  # Which exchange provides the settlement reference price for each asset.
  # Kalshi settles against Coinbase for most assets; Binance for HYPE and BNB.
  settlement_source:
    BTC: coinbase
    ETH: coinbase
    XRP: coinbase
    SOL: coinbase
    DOGE: coinbase
    HYPE: binance
    BNB: binance
