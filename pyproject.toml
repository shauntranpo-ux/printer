[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kalshi-botv3"
version = "0.1.0"
description = "15-minute Kalshi crypto up/down market trading bot (v3)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "websockets>=13.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.3",
    "apscheduler>=3.10.4",
    "structlog>=24.4.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.31.0",
    "pyyaml>=6.0.2",
    "cryptography>=43.0.1",
    "pandas>=2.2.3",
    "numpy>=2.1.1",
    "tenacity>=9.1.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.9",
    "mypy>=1.11.2",
    "pre-commit>=3.8.0",
    "types-PyYAML>=6.0.12",
    "respx>=0.23.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "apply_suggestions.py",
    "asset_manager.py",
    "backtest.py",
    "bot.py",
    "claude_analyzer.py",
    "discover_markets.py",
    "download_data.py",
    "generate_bv3_table.py",
    "price_validator.py",
    "runner.py",
    "server.py",
    "validate_and_report.py",
    "weekly_report.py",
    "backtesting/",
    "alembic/versions/",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
disallow_untyped_defs = true
disallow_any_generics = true
exclude = ["tests/"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
