# QUARANTINED — this project file describes an abandoned rewrite ("kalshi-botv3").
# The live bot uses requirements.txt + flat top-level .py files. See ARCHITECTURE.md.
# Do not "fix" inconsistencies between this file and the live bot — they are intentional.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kalshi-botv3"
version = "0.1.0"
description = "15-minute Kalshi crypto up/down market trading bot (v3)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "websockets>=13.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.3",
    "apscheduler>=3.10.4",
    "structlog>=24.4.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.31.0",
    "pyyaml>=6.0.2",
    "cryptography>=43.0.1",
    "pandas>=2.2.3",
    "numpy>=2.1.1",
    "tenacity>=9.1.4",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "aiohttp>=3.13.5",
    "requests>=2.33.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.9",
    "mypy>=1.11.2",
    "pre-commit>=3.8.0",
    "types-PyYAML>=6.0.12",
    "respx>=0.23.1",
    "pandas-stubs>=3.0.0.260204",
    "pyarrow>=23.0.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "backtesting/",
    "alembic/versions/",
]

[tool.ruff.lint]
select = ["E", "F"]

[tool.ruff.lint.per-file-ignores]
# Legacy files: suppress style and common legacy patterns.
"*.py" = ["E501", "E402", "E701", "E702", "E731", "E741", "F401", "F541", "F841"]
"tests/**" = ["E501", "F401"]
# Pre-existing bug: ASSETS used but never defined in this standalone script.
"weekly_report.py" = ["F821"]

[tool.mypy]
python_version = "3.11"
strict = true
disallow_untyped_defs = true
disallow_any_generics = true
exclude = ["tests/"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["strategies"]
